<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>KISWA — Résine . Sols . Design</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C0C0D">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<main id="page">

  <section class="sec sec-hero" id="ouverture">
    <div class="pin">
      <p class="mark-small" data-el="markSmall"></p>
      <div class="lockup" data-el="heroLockup">
        <h1 class="wordmark" data-el="heroMark"></h1>
        <p class="baseline" data-el="heroBaseline"></p>
        <p class="subline" data-el="heroSub"></p>
      </div>
      <p class="cue" data-el="cue"></p>
    </div>
  </section>

  <section class="sec sec-fin" id="finitions">
    <div class="pin">
      <div class="panel" data-el="panel">
        <h2 class="eyebrow" data-el="finTitre"></h2>
        <div class="tabs" role="tablist" data-el="tabs"></div>
        <div class="finish" role="tabpanel" data-el="finish"></div>
      </div>
    </div>
  </section>

  <section class="sec sec-coupe" id="coupe">
    <div class="pin">
      <h2 class="title" data-el="coupeTitre"></h2>
      <ol class="tags" data-el="tags"></ol>
    </div>
  </section>

  <section class="page-or" id="savoir-faire">
    <div class="page-in">
      <h2 class="title" data-el="savoirTitre"></h2>
      <div class="prose" data-el="savoirTexte"></div>
    </div>
  </section>

  <section class="sec sec-chiffres" id="chiffres">
    <div class="pin">
      <ul class="figures" data-el="chiffres"></ul>
    </div>
  </section>

  <section class="sec sec-end" id="fin">
    <div class="pin">
      <div class="lockup" data-el="endLockup">
        <p class="wordmark" data-el="endMark"></p>
        <p class="baseline" data-el="endBaseline"></p>
        <p class="subline" data-el="endZone"></p>
        <div class="contact" data-el="contact" hidden></div>
      </div>
    </div>
  </section>

</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
