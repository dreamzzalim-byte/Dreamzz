<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Autorisation TikTok</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #fafafa; }
    main { width: min(560px, calc(100% - 40px)); padding: 32px; border: 1px solid #27272a; border-radius: 20px; background: #18181b; box-shadow: 0 24px 80px #0008; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { color: #d4d4d8; line-height: 1.5; }
    code { display: block; padding: 14px; overflow-wrap: anywhere; border-radius: 10px; background: #09090b; color: #5eead4; }
    button { margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; background: #fff; color: #09090b; }
    .error { color: #fda4af; }
  </style>
</head>
<body>
  <main>
    <h1>Autorisation TikTok</h1>
    <div id="content"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error_description') || params.get('error');
    const content = document.getElementById('content');
    if (code && state) {
      content.innerHTML = '<p>Autorisation réussie. Copie ces deux valeurs dans le workflow GitHub :</p><p>Code</p><code id="code"></code><button id="copy-code">Copier le code</button><p>État</p><code id="state"></code><button id="copy-state">Copier l’état</button>';
      document.getElementById('code').textContent = code;
      document.getElementById('state').textContent = state;
      document.getElementById('copy-code').onclick = async () => {
        await navigator.clipboard.writeText(code);
        document.getElementById('copy-code').textContent = 'Code copié';
      };
      document.getElementById('copy-state').onclick = async () => {
        await navigator.clipboard.writeText(state);
        document.getElementById('copy-state').textContent = 'État copié';
      };
    } else {
      content.innerHTML = '<p class="error"></p><p>Tu peux fermer cette page et recommencer l’autorisation.</p>';
      content.querySelector('.error').textContent = error || 'Aucun code d’autorisation reçu.';
    }
  </script>
</body>
</html>
